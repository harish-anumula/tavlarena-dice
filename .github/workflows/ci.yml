name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Verify a vector proof with the CLI
        run: |
          node -e 'const v=require("./vectors/v1.json");process.stdout.write(JSON.stringify(v.cases[0].proof,null,2))' > proof.json
          node bin/verify.mjs verify proof.json
          node -e 'const p=require("./proof.json");p.rolls[0].dice[0]=p.rolls[0].dice[0]%6+1;process.stdout.write(JSON.stringify(p))' > tampered.json
          if node bin/verify.mjs verify tampered.json; then echo "tampered proof passed"; exit 1; fi
      - run: npm pack --dry-run
